name: Manual — Pre-Release Staging

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Version tag override — leave blank to infer from open release-please PR
        required: false
        type: string
        default: ""

permissions:
  contents: write
  models: read
  pull-requests: read

jobs:
  stage:
    uses: ScottKirvan/.github/.github/workflows/reusable-pre-release-staging.yml@main
    with:
      tag_name: ${{ inputs.tag_name }}
      project_name: "BojuBot"
      project_context: "BojuBot is an Obsidian plugin that brings AI conversation directly into a personal notes vault. Most users are writers, researchers, and everyday thinkers who want help brainstorming, editing prose, and working through ideas — the plugin handles the technical complexity so they can focus on their work. Some changes target power users, developers, or anyone customizing or distributing BojuBot; when a change is clearly for that audience, write the explanation in terms of what they specifically gain."
      header: |
        ## 👾 BojuBot for Obsidian 👾

        More than a writing assistant — BojuBot turns your Obsidian vault into a personal AI platform using Claude Code

        🫶❤️[Support this project](https://ko-fi.com/ScottKirvan) · 📖 [User Guide](https://www.scottkirvan.com/BojuBot/) · 💬 [Discord](https://discord.gg/TN6XJSNK5Y) · 🐛 [Report a Bug](https://github.com/ScottKirvan/BojuBot/issues/new?template=bug_report.md) · ✨ [Request Feature](https://github.com/ScottKirvan/BojuBot/issues/new?template=feature_request.md) · 📋 [Changelog](https://github.com/ScottKirvan/BojuBot/blob/main/notes/CHANGELOG.md)

    secrets: inherit
