# Dependabot version updates, kept low-noise on purpose:
# - Monthly, one grouped PR per ecosystem for GitHub Actions.
# - Package updates: minor and patch bumps come as one grouped PR; each major
#   bump gets its own PR, since those are the ones that break things.
# - Commits use `chore(deps):`, so release-please doesn't cut a release for them.
# - Cooldown: a new release waits 7 days before Dependabot offers it, so a
#   compromised or broken release is usually caught and pulled first.
#   Security fix PRs are not delayed.
#
# Security alerts and security fix PRs are separate repo settings
# (Settings > Code security) and are turned on; those PRs use the options here.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5
    ignore:
      # The plugin runs on the Node built into Obsidian's Electron, which is
      # older than current Node (and older still on installs that haven't
      # updated). Newer types would allow APIs that fail at runtime, so major
      # bumps are made by hand to match the oldest supported Obsidian.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the native compiler) isn't supported by typescript-eslint
      # yet: npm ci fails on its peer dependency. Remove once it is.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
